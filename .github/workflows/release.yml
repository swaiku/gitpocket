name: Release

# Runs on every push to main. If the version in .bumpversion.toml (bumped on
# develop with `bump-my-version bump`) has no tag yet, build the app on Linux,
# macOS and Windows and publish the GitHub release, which also creates the tag.
# The release stays a draft until every platform has built, so a failed build
# never leaves a half-published release. Uses GITHUB_TOKEN only.
#
# The installers are not code-signed: macOS and Windows will warn on first launch.

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Detect version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      new: ${{ steps.version.outputs.new }}
      release_id: ${{ steps.draft.outputs.release_id }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7

      - name: Detect version to release
        id: version
        run: |
          tag="v$(uvx bump-my-version show current_version)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag already released, nothing to do"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate release notes
        if: steps.version.outputs.new == 'true'
        uses: orhun/git-cliff-action@v4
        with:
          config: .github/cliff.toml
          args: --unreleased --strip header --tag ${{ steps.version.outputs.tag }}
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}

      # A draft has no tag, so an earlier failed run leaves a stale draft: drop it.
      - name: Create the draft release
        id: draft
        if: steps.version.outputs.new == 'true'
        run: |
          tag=${{ steps.version.outputs.tag }}
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.draft and .tag_name == \"$tag\") | .id" \
            | xargs -r -I{} gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/{}"
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$tag" -f target_commitish="$GITHUB_SHA" -f name="GitPocket $tag" \
            -F body=@RELEASE_NOTES.md -F draft=true --jq .id)
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    if: needs.prepare.outputs.new == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            platform: ubuntu-22.04
            args: ""
          - name: macOS (Apple silicon)
            platform: macos-latest
            args: --target aarch64-apple-darwin
          - name: macOS (Intel)
            platform: macos-latest
            args: --target x86_64-apple-darwin
          - name: Windows
            platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.args }}

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev pkg-config

      - run: bun install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          args: ${{ matrix.args }}

  publish:
    name: Publish release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Publishing creates the tag on the commit the draft targets.
      - name: Publish
        run: >
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/${{ needs.prepare.outputs.release_id }}"
          -F draft=false
        env:
          GH_TOKEN: ${{ github.token }}
