version: 2
updates:
  - package-ecosystem: bun
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: "⬆️"
    groups:
      bun-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /src-tauri
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: "⬆️"
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: "👷"
    groups:
      actions:
        patterns: ["*"]
